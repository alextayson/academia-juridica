<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Progresso - Academia Jurídica</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-header {
            background: linear-gradient(135deg, #1b1938 0%, #2d2654 100%);
            color: white;
            padding: 60px 20px;
        }

        .dashboard-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin: 40px 0;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #714cb6;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
        }

        .progress-section {
            margin: 40px 0;
        }

        .progress-course {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .progress-course h3 {
            margin-bottom: 16px;
        }

        .progress-bar-large {
            height: 12px;
            background: #f0f0f0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill-large {
            height: 100%;
            background: linear-gradient(90deg, #714cb6, #9b6fd9);
            transition: width 0.3s;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" style="color: inherit; text-decoration: none;">Academia Jurídica</a>
            </div>
            <div class="nav-links">
                <a href="index.html">Cursos</a>
                <a href="progress.html">Meu Progresso</a>
                <div id="userMenu" style="display: none;">
                    <span id="userName"></span>
                    <button class="nav-cta" id="logoutBtn">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-header">
        <div class="dashboard-content">
            <h1>Meu Progresso</h1>
            <p>Acompanhe seu desenvolvimento</p>
        </div>
    </div>

    <div class="container" style="padding: 40px 20px;">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalCourses">0</div>
                <div class="stat-label">Cursos Inscritos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedCourses">0</div>
                <div class="stat-label">Cursos Concluídos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalHours">0h</div>
                <div class="stat-label">Horas Assistidas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgProgress">0%</div>
                <div class="stat-label">Progresso Médio</div>
            </div>
        </div>

        <div class="progress-section">
            <h2 class="section-title">Cursos em Andamento</h2>
            <div id="progressList">
                <p>Carregando...</p>
            </div>
        </div>
    </div>

    <script type="module" src="progress.js"></script>
</body>
</html>
